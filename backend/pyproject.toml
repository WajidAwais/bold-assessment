[project]
name = "techforce-backend"
version = "0.1.0"
description = "TechForce candidate import and scoped recruiter API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "pytest-playwright>=0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# e2e drives the browser against the running compose stack; it's deselected by
# default. Run it with `uv run pytest -m e2e --browser-channel chrome`.
addopts = ["-m", "not e2e"]
markers = [
    "e2e: Recruiter view browser tests; need the compose stack running (docker compose up -d)",
]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
